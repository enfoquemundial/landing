<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué quieres proteger? | Gordo GPS</title>
<meta name="description" content="Elige dónde vas a instalar tu GPS: vehículo personal, moto, flotilla, dashcam o GPS portátil. Gordo GPS — protección vehicular con tecnología real.">
<meta name="theme-color" content="#0C0C0E">
<link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #0C0C0E; --bg-2: #121214; --card: #18181B;
    --card-border: rgba(255,255,255,.08); --card-border-strong: rgba(220,38,38,.4);
    --text: #F4F4F5; --text-muted: #A3A3A8;
    --accent: #DC2626; --accent-hover: #B91C1C;
    --font-head: 'Oswald', sans-serif; --font-body: 'Rajdhani', sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; font-family: var(--font-body); font-size: 16px; color: var(--text);
    background: var(--bg); background-image: radial-gradient(50% 40% at 85% 0%, rgba(220,38,38,.10), transparent 60%);
    display: flex; flex-direction: column; align-items: center; padding: 56px 20px 110px;
  }
  h1, h2 { font-family: var(--font-head); margin: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 46px; width: auto; }
  .intro { text-align: center; max-width: 560px; margin: 40px auto 8px; }
  .intro .eyebrow {
    display: inline-block; font-family: var(--font-head); font-size: 0.78rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent);
  }
  .intro h1 { margin-top: 12px; font-size: clamp(1.7rem, 5vw, 2.3rem); text-transform: uppercase; letter-spacing: -0.01em; }
  .intro p { margin-top: 12px; color: var(--text-muted); font-size: 1.05rem; }

  .options-grid {
    margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
    max-width: 980px; width: 100%;
  }
  .option-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden;
    text-decoration: none; color: var(--text); display: flex; flex-direction: column;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .option-card:hover {
    transform: translateY(-6px); border-color: var(--accent);
    box-shadow: 0 20px 40px -18px rgba(220,38,38,.5);
  }
  .option-card:active { transform: translateY(-2px); }
  .option-media { aspect-ratio: 4/3; overflow: hidden; background: var(--bg-2); }
  .option-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .option-card:hover .option-media img { transform: scale(1.08); }
  .option-body { padding: 16px 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .option-body h2 { font-size: 1.02rem; text-transform: uppercase; line-height: 1.25; }
  .option-body svg { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; transition: transform .25s ease; }
  .option-card:hover .option-body svg { transform: translateX(4px); }

  @media (max-width: 860px) {
    .options-grid { grid-template-columns: repeat(2, 1fr); max-width: 640px; }
  }
  @media (max-width: 520px) {
    .options-grid { grid-template-columns: 1fr; max-width: 380px; }
    .option-media { aspect-ratio: 16/9; }
  }

  .old-site-btn {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-border-strong); color: var(--text-muted);
    font-family: var(--font-body); font-weight: 600; font-size: 0.82rem;
    padding: 10px 16px; border-radius: 999px; text-decoration: none;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,.6);
    transition: color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .old-site-btn:hover { color: var(--text); border-color: var(--accent); transform: translateY(-2px); }
  .old-site-btn svg { width: 14px; height: 14px; }

  @media (max-width: 480px) {
    .old-site-btn { right: 12px; bottom: 12px; padding: 9px 13px; font-size: 0.76rem; }
  }
</style>
</head>
<body>

  <a href="index.html" class="brand">
    <img src="assets/images/logo-gordo.webp" alt="Gordo GPS">
  </a>

  <div class="intro">
    <span class="eyebrow">Pantalla inicial</span>
    <h1>¿Qué quieres proteger?</h1>
    <p>Elige dónde vas a instalar tu GPS</p>
  </div>

  <div class="options-grid">

      </div>
      <div class="option-body">
        <h2>Vehículo personal</h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>

    <a class="option-card" href="gps-portatiles.html">
      <div class="option-media">

      </div>
      <div class="option-body">
        <h2>Motor / Pasola</h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>

    <a class="option-card" href="gps-portatiles.html">
      <div class="option-media">
        <img src="https://images.unsplash.com/photo-1587813369290-091c9d432daf?auto=format&fit=crop&w=800&q=75" alt="Flotillas" loading="lazy">
      </div>
      <div class="option-body">
        <h2>Flotillas</h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>

    <a class="option-card" href="gps-portatiles.html">
      <div class="option-media">
        <img src="https://images.unsplash.com/photo-1765959106936-851735565c12?auto=format&fit=crop&w=800&q=75" alt="Dashcam / Cámara vehicular" loading="lazy">
      </div>
      <div class="option-body">
        <h2>Dashcam / Cámara vehicular</h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>

    <a class="option-card" href="gps-portatiles.html">
      <div class="option-media">
        <img src="https://images.unsplash.com/photo-1754821305530-8e3c7b8deda2?auto=format&fit=crop&w=800&q=75" alt="GPS Portátiles" loading="lazy">
      </div>
      <div class="option-body">
        <h2>GPS Portátiles</h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </a>

  </div>

  <a href="gps-portatiles.html" class="old-site-btn">
    Web antigua
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

</body>
</html>
