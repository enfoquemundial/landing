<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda tu cita | Gordo GPS</title>
<meta name="description" content="Agenda la instalación de tu GPS: cuéntanos tu vehículo, el plan que quieres y cuándo te queda mejor.">
<meta name="theme-color" content="#0C0C0E">
<link rel="icon" href="../assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>

:root {
  --bg: #0C0C0E; --bg-2: #121214; --card: #18181B;
  --card-border: rgba(255,255,255,.08); --card-border-strong: rgba(220,38,38,.4);
  --text: #F4F4F5; --text-muted: #A3A3A8; --text-faint: #6B6B70;
  --accent: #DC2626; --accent-hover: #B91C1C;
  --font-head: 'Oswald', sans-serif; --font-body: 'Rajdhani', sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font-body); font-size: 16px; color: var(--text);
  background: #040305; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-head); margin: 0; }
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

/* ---- Fondo animado (igual al resto del sitio) ---- */
.bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
.red-laser-glow {
  position: absolute; top: -20%; right: -10%; width: 75vw; height: 140vh;
  background: radial-gradient(ellipse at center, rgba(235,20,20,.32) 0%, rgba(180,0,0,.12) 45%, rgba(0,0,0,0) 75%);
  filter: blur(60px); transform: rotate(-15deg);
}
#dotsCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bg-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.svg-line-group { transform-origin: center; animation: waveMotion 12s ease-in-out infinite alternate; }
.svg-line-group-reverse { transform-origin: center; animation: waveMotionAlt 16s ease-in-out infinite alternate; }
@keyframes waveMotion {
  0% { transform: translateY(0) scaleY(1) rotate(0deg); }
  50% { transform: translateY(-25px) scaleY(1.05) rotate(.8deg); }
  100% { transform: translateY(20px) scaleY(.95) rotate(-.5deg); }
}
@keyframes waveMotionAlt {
  0% { transform: translateY(0) scaleX(1) rotate(0deg); }
  50% { transform: translateY(20px) scaleX(1.03) rotate(-.8deg); }
  100% { transform: translateY(-18px) scaleX(.97) rotate(.6deg); }
}

/* ---- Header ---- */
.topbar { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 26px 24px 0; display: flex; align-items: center; justify-content: space-between; }
.brand-fa { display: flex; align-items: center; gap: 8px; }
.brand-fa-icon-wrap { position: relative; width: 28px; aspect-ratio: 936/805; }
.brand-fa-icon-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; }
.brand-fa-text { display: inline-block; line-height: 1; margin-left: 2px; }
.brand-fa-text .gordo { color: #fff; font-size: 1.2rem; font-weight: 900; letter-spacing: -0.02em; font-family: var(--font-head); }
.brand-fa-text .gps { color: var(--accent); font-size: 1.2rem; font-weight: 300; letter-spacing: -0.02em; font-family: var(--font-head); margin-left: 5px; }
.brand-fa-underline { display: block; height: 2px; width: 100%; background: linear-gradient(to right, var(--accent), transparent); margin-top: 3px; }
.back-link {
  display: inline-flex; align-items: center; gap: 7px; color: var(--text-muted);
  font-size: 0.85rem; font-weight: 600; transition: color .2s ease;
}
.back-link:hover { color: var(--text); }
.back-link svg { width: 15px; height: 15px; }

/* ---- Página: dos columnas, como el inicio ---- */
.shell { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 30px 24px 90px; }
.agenda-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 48px; align-items: start; margin-top: 30px; }
.agenda-left { position: sticky; top: 26px; }
.agenda-left .accent-bar { display: block; height: 4px; width: 56px; background: var(--accent); margin-bottom: 22px; }
.agenda-left .eyebrow {
  display: inline-block; font-family: var(--font-head); font-size: 0.85rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--accent); font-weight: 600;
}
.agenda-left h1 {
  margin-top: 16px; font-size: clamp(2.8rem, 5vw, 3.8rem); font-weight: 700;
  line-height: 1; letter-spacing: -0.015em; color: var(--text);
}
.agenda-left h1 .accent { color: var(--accent); }
.agenda-left p { margin-top: 22px; color: var(--text-muted); font-size: 1.18rem; max-width: 40ch; line-height: 1.7; font-weight: 400; }

.agenda-store-photo {
  position: relative; margin-top: 38px; width: 100%; max-width: 380px; aspect-ratio: 3/4;
  -webkit-mask-image: radial-gradient(120% 100% at 30% 25%, black 42%, transparent 78%);
  mask-image: radial-gradient(120% 100% at 30% 25%, black 42%, transparent 78%);
}
.agenda-store-photo img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 22px;
  filter: saturate(1.05) contrast(1.03);
}
.agenda-store-photo::after {
  content: ""; position: absolute; inset: 0; border-radius: 22px;
  background: linear-gradient(160deg, rgba(220,38,38,.16), transparent 55%, rgba(4,4,5,.5));
  pointer-events: none;
}

.appt-card {
  background: rgba(18,18,20,.7); backdrop-filter: blur(8px);
  border: 1px solid var(--card-border-strong); border-radius: 18px; padding: 30px 26px;
}
.appt-form { display: flex; flex-direction: column; gap: 18px; }
.appt-form label {
  display: flex; flex-direction: column; gap: 7px;
  font-family: var(--font-body); font-weight: 600; font-size: 0.9rem; color: var(--text);
}
.appt-label-row { display: flex; align-items: center; gap: 8px; }
.appt-label-row svg { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }
.appt-form input, .appt-form select {
  font-family: var(--font-body); font-size: 0.98rem; color: var(--text);
  background: var(--card); border: 1px solid var(--card-border); border-radius: 10px;
  padding: 12px 14px; outline: none; transition: border-color .2s ease;
}
.appt-form input:focus, .appt-form select:focus { border-color: var(--accent); }
.appt-form select {
  appearance: none; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A3A3A8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center; background-size: 16px;
}

/* ---- Mini calendario propio para "Día" ---- */
.appt-date-wrap { position: relative; }
.appt-date-wrap input { width: 100%; cursor: pointer; }
.appt-calendar {
  display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 50;
  width: 280px; max-width: 90vw; background: var(--bg-2); border: 1px solid var(--card-border-strong);
  border-radius: 14px; padding: 14px; box-shadow: 0 20px 45px -15px rgba(0,0,0,.7);
}
.appt-calendar.is-open { display: block; }
.appt-cal-head { display: flex; align-items: center; justify-content: space-between; }
.appt-cal-title { font-family: var(--font-head); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: .02em; }
.appt-cal-nav {
  width: 30px; height: 30px; border-radius: 8px; background: var(--card); border: 1px solid var(--card-border);
  color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: color .2s ease, border-color .2s ease;
}
.appt-cal-nav:hover { color: var(--text); border-color: var(--accent); }
.appt-cal-nav svg { width: 16px; height: 16px; }
.appt-cal-weekdays, .appt-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.appt-cal-weekdays { margin-top: 12px; }
.appt-cal-weekdays span { text-align: center; font-size: 0.7rem; color: var(--text-faint); font-weight: 600; padding-bottom: 6px; }
.appt-cal-grid { gap: 3px; margin-top: 2px; }
.appt-cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px;
  font-size: 0.86rem; color: var(--text); cursor: pointer; background: transparent; border: none;
  font-family: var(--font-body); transition: background .15s ease, color .15s ease;
}
.appt-cal-day:hover { background: rgba(220,38,38,.15); }
.appt-cal-day.is-outside { color: var(--text-faint); opacity: .4; }
.appt-cal-day.is-today { border: 1px solid var(--card-border-strong); }
.appt-cal-day.is-selected { background: var(--accent); color: #fff; font-weight: 700; }
.appt-submit {
  margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; height: 54px; border-radius: 999px; border: none; cursor: pointer;
  background: #1FA855; color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 1.02rem;
  box-shadow: 0 10px 24px -10px rgba(31,168,85,.55); transition: transform .2s ease, box-shadow .2s ease;
}
.appt-submit:hover { transform: translateY(-2px); }
.appt-submit svg { width: 22px; height: 22px; }

.appt-location-row { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.appt-location-row input { width: 100%; }
.appt-geo-btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 8px 16px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-border-strong); color: var(--accent);
  font-family: var(--font-body); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .02em;
  transition: background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
}
.appt-geo-btn:hover { border-color: var(--accent); background: rgba(220,38,38,.1); transform: translateY(-1px); }
.appt-geo-btn:active { transform: translateY(0); }
.appt-geo-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.appt-geo-btn .geo-icon-spinner, .appt-geo-btn .geo-icon-check { display: none; }
.appt-geo-btn.is-loading .geo-icon-pin { display: none; }
.appt-geo-btn.is-loading .geo-icon-spinner { display: block; animation: geoSpin .8s linear infinite; }
.appt-geo-btn.is-done { background: rgba(31,168,85,.15); border-color: #1FA855; color: #1FA855; }
.appt-geo-btn.is-done .geo-icon-pin { display: none; }
.appt-geo-btn.is-done .geo-icon-check { display: block; }
@keyframes geoSpin { to { transform: rotate(360deg); } }
.appt-geo-status { display: block; margin-top: 6px; font-size: 0.78rem; font-weight: 500; color: var(--text-muted); min-height: 1em; }
.appt-geo-status.is-ok { color: #1FA855; }
.appt-geo-status.is-error { color: var(--accent); }

@media (max-width: 900px) {
  .agenda-grid { grid-template-columns: 1fr; gap: 4px; margin-top: 14px; }
  .agenda-left { order: -1; text-align: left; position: static; }
  .agenda-left .accent-bar { display: none; }
  .agenda-left .eyebrow { display: none; }
  .agenda-left h1 { margin-top: 0; font-size: 1.35rem; }
  .agenda-left p { display: none; }
  .agenda-store-photo { display: none; }
  .appt-card { margin-top: 14px; }
  .shell { padding-top: 18px; }
  .topbar { padding-top: 16px; }
}
@media (max-width: 560px) {
  .appt-card { padding: 22px 16px; }
}

</style>
</head>
<body>

<div class="bg-canvas" aria-hidden="true">
  <div class="red-laser-glow"></div>
  <canvas id="dotsCanvas"></canvas>
  <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff1e1e" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="thinLine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
        <stop offset="50%" stop-color="#ef4444" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
      </linearGradient>
    </defs>
    <g class="svg-line-group">
      <path d="M -100 200 C 300 600, 800 -100, 1600 500" stroke="url(#redGlow)" stroke-width="4" fill="none" filter="drop-shadow(0 0 12px #ff0000)" />
      <path d="M -50 250 C 350 650, 850 -50, 1650 550" stroke="url(#redGlow)" stroke-width="1.5" fill="none" />
    </g>
    <g class="svg-line-group-reverse">
      <path d="M -200 900 C 400 400, 900 1100, 1800 200" stroke="url(#thinLine)" stroke-width="1" fill="none" />
      <path d="M -200 850 C 400 350, 900 1050, 1800 150" stroke="url(#thinLine)" stroke-width="1" fill="none" />
      <path d="M -200 800 C 400 300, 900 1000, 1800 100" stroke="url(#thinLine)" stroke-width="0.75" fill="none" />
      <path d="M -200 750 C 400 250, 900 950, 1800 50" stroke="url(#thinLine)" stroke-width="0.5" fill="none" />
      <path d="M -100 100 C 500 800, 1100 300, 1900 900" stroke="url(#thinLine)" stroke-width="0.8" fill="none" />
      <path d="M -100 150 C 500 850, 1100 350, 1900 950" stroke="url(#thinLine)" stroke-width="0.5" fill="none" />
    </g>
  </svg>
</div>

<div class="topbar">
  <a href="gps-portatiles.html" class="brand-fa">
    <span class="brand-fa-icon-wrap">
      <img src="../assets/images/piece-plane.webp" alt="">
      <img src="../assets/images/piece-pin.webp" alt="">
    </span>
    <span class="brand-fa-text">
      <span class="gordo">GORDO</span><span class="gps">GPS</span>
      <span class="brand-fa-underline"></span>
    </span>
  </a>
  <a href="gps-portatiles.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Volver
  </a>
</div>

<div class="shell">

  <div class="agenda-grid">

    <div class="agenda-left">
      <span class="accent-bar"></span>
      <span class="eyebrow">Reserva tu instalación</span>
      <h1>Agenda tu <span class="accent">cita</span></h1>
      <p>Completa tus datos y te confirmamos por WhatsApp. Elegimos contigo el día, la hora y el plan que más te convenga.</p>
      <div class="agenda-store-photo">
        <img src="../assets/images/local-dueno.webp" alt="Local físico de Gordo GPS">
      </div>
    </div>

    <div class="appt-card">
    <form class="appt-form" id="appointmentForm">

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path stroke-linejoin="miter" d="M4.5 20c0-4.1 3.4-6.8 7.5-6.8s7.5 2.7 7.5 6.8"/></svg>Nombre</span>
        <input type="text" name="nombre" placeholder="Ej: Carlos Pérez" required>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path stroke-linejoin="miter" d="M6 3h4l1.5 4-2 1.5a11 11 0 006.5 6.5L17.5 13l4 1.5v4a2 2 0 01-2.2 2C11.8 20 4 12.2 4 5.2A2 2 0 016 3z"/></svg>WhatsApp</span>
        <input type="tel" name="whatsapp" placeholder="809-000-0000" required>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><rect x="3" y="5" width="18" height="14" stroke-linejoin="miter"/><path stroke-width="1.8" stroke-linejoin="miter" d="M3.5 5.8l8.5 7 8.5-7"/></svg>Correo</span>
        <input type="email" name="correo" placeholder="ejemplo@correo.com">
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><rect x="3" y="5" width="18" height="16" stroke-linejoin="miter"/><path stroke-width="2.1" stroke-linecap="square" d="M8 3v4M16 3v4M3 10h18"/><path fill="currentColor" stroke="none" d="M12 14l3 1.4-3 1.4z"/><path stroke-width="1.6" d="M12 14v5"/></svg>Día</span>
        <div class="appt-date-wrap">
          <input type="text" name="dia" id="diaInput" placeholder="DD/MM/AAAA" autocomplete="off" required>
          <div class="appt-calendar" id="apptCalendar">
            <div class="appt-cal-head">
              <button type="button" class="appt-cal-nav" id="calPrev" aria-label="Mes anterior">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <span class="appt-cal-title" id="calTitle"></span>
              <button type="button" class="appt-cal-nav" id="calNext" aria-label="Mes siguiente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
            <div class="appt-cal-weekdays">
              <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
            </div>
            <div class="appt-cal-grid" id="calGrid"></div>
          </div>
        </div>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path stroke-width="1.8" stroke-linecap="square" d="M12 7v5.2l3.6 2"/></svg>Hora</span>
        <input type="text" name="hora" placeholder="Ej: 3:00 pm" required>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path stroke-linejoin="miter" d="M3 16l1.6-5A2 2 0 016.5 9.5h11a2 2 0 011.9 1.5L21 16"/><path stroke-linecap="square" d="M2.5 16h19"/><circle cx="6.5" cy="17.3" r="1.7"/><circle cx="17.5" cy="17.3" r="1.7"/></svg>Vehículo</span>
        <input type="text" name="vehiculo" placeholder="Marca, modelo y año" required>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><circle cx="7" cy="12" r="4"/><path stroke-linecap="square" d="M10.5 12H21M17.5 12v3M21 12v3"/></svg>Encendido (Botón o llave)</span>
        <select name="encendido">
          <option value="Botón">Botón</option>
          <option value="Llave">Llave</option>
        </select>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path stroke-linejoin="miter" d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path stroke-width="1.6" stroke-linejoin="miter" d="M4 7.2L12 11l8-3.8M12 11v10"/></svg>Plan</span>
        <select name="plan">
          <option value="Premium">Premium</option>
          <option value="VIP">VIP</option>
        </select>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path stroke-linejoin="miter" d="M12 2L22 20H2z"/><path stroke-width="2" stroke-linecap="square" d="M12 9v5"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>Contacto de emergencia</span>
        <input type="text" name="emergencia" placeholder="Nombre y teléfono">
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" stroke-linejoin="miter"/><path stroke-linecap="square" d="M2.5 9.8h19"/><path stroke-width="1.8" stroke-linecap="square" d="M5.5 14.5h5"/></svg>Método de pago</span>
        <select name="pago">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
        </select>
      </label>

      <label>
        <span class="appt-label-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><path stroke-linejoin="miter" d="M7 6H17L19 10L12 22L5 10Z"/><path stroke-width="1.5" d="M9 10.5H15M12 7.5V13.5"/></svg>Ubicación</span>
        <div class="appt-location-row">
          <input type="text" name="ubicacion" id="ubicacionInput" placeholder="Dirección de instalación" required>
          <button type="button" class="appt-geo-btn" id="geoBtn" aria-label="Enviar ubicación real" title="Enviar ubicación real">
            <svg class="geo-icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path stroke-linejoin="miter" d="M7 6H17L19 10L12 22L5 10Z"/><path stroke-width="1.6" d="M9 10.5H15M12 7.5V13.5"/></svg>
            <svg class="geo-icon-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" d="M12 3a9 9 0 019 9"/></svg>
            <svg class="geo-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
            <span>Enviar ubicación real</span>
          </button>
        </div>
        <span class="appt-geo-status" id="geoStatus"></span>
      </label>

      <button type="submit" class="appt-submit">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-2-1.2-.7-.7-1.2-1.5-1.4-1.7-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.3-.4.1-.2 0-.3 0-.5 0-.1-.6-1.5-.9-2.1-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2s1 2.5 1.1 2.7c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>
        Enviar por WhatsApp
      </button>

    </form>
    </div>

  </div>

</div>

<script>
  // Puntos rojos flotando sutilmente sobre el fondo — 100% código.
  (function () {
    var canvas = document.getElementById('dotsCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    var dots = [];
    for (var i = 0; i < 50; i++) {
      dots.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        radius: Math.random() * 1.8 + 0.6,
        vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
        alpha: Math.random() * 0.6 + 0.2, pulse: Math.random() * 0.01 + 0.003
      });
    }
    function animateDots() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dots.forEach(function (dot) {
        dot.x += dot.vx; dot.y += dot.vy;
        if (dot.x < 0) dot.x = canvas.width;
        if (dot.x > canvas.width) dot.x = 0;
        if (dot.y < 0) dot.y = canvas.height;
        if (dot.y > canvas.height) dot.y = 0;
        dot.alpha += Math.sin(Date.now() * dot.pulse * 0.05) * 0.002;
        var a = Math.max(0.15, Math.min(0.85, dot.alpha));
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(239, 68, 68, ' + a + ')';
        ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 6;
        ctx.fill();
      });
      requestAnimationFrame(animateDots);
    }
    animateDots();
  })();

  // Mini calendario propio para el campo "Día" — 100% código, sin el selector nativo.
  (function () {
    var input = document.getElementById('diaInput');
    var cal = document.getElementById('apptCalendar');
    var title = document.getElementById('calTitle');
    var grid = document.getElementById('calGrid');
    var btnPrev = document.getElementById('calPrev');
    var btnNext = document.getElementById('calNext');
    if (!input || !cal) return;

    var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    var today = new Date();
    var viewYear = today.getFullYear();
    var viewMonth = today.getMonth();
    var selected = null;

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function render() {
      title.textContent = MESES[viewMonth] + ' ' + viewYear;
      grid.innerHTML = '';
      var firstDay = new Date(viewYear, viewMonth, 1).getDay();
      var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

      for (var i = firstDay - 1; i >= 0; i--) {
        grid.appendChild(makeDay(daysInPrevMonth - i, true, false));
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var isToday = d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
        var isSelected = selected && selected.d === d && selected.m === viewMonth && selected.y === viewYear;
        grid.appendChild(makeDay(d, false, isToday, isSelected, viewMonth, viewYear));
      }
      var totalCells = firstDay + daysInMonth;
      var remaining = (7 - (totalCells % 7)) % 7;
      for (var n = 1; n <= remaining; n++) {
        grid.appendChild(makeDay(n, true, false));
      }
    }

    function makeDay(num, outside, isToday, isSelected, m, y) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'appt-cal-day' + (outside ? ' is-outside' : '') + (isToday ? ' is-today' : '') + (isSelected ? ' is-selected' : '');
      btn.textContent = num;
      if (!outside) {
        btn.addEventListener('click', function () {
          selected = { d: num, m: m, y: y };
          input.value = pad(num) + '/' + pad(m + 1) + '/' + y;
          closeCal();
        });
      }
      return btn;
    }

    function openCal() { cal.classList.add('is-open'); render(); }
    function closeCal() { cal.classList.remove('is-open'); }

    input.addEventListener('click', function (e) { e.stopPropagation(); openCal(); });
    input.addEventListener('focus', openCal);
    btnPrev.addEventListener('click', function () {
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    });
    btnNext.addEventListener('click', function () {
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      render();
    });
    document.addEventListener('click', function (e) {
      if (!cal.contains(e.target) && e.target !== input) closeCal();
    });
  })();

  // Botón "Enviar ubicación" -> pide el GPS real del navegador y lo agrega al campo
  (function () {
    var btn = document.getElementById('geoBtn');
    var input = document.getElementById('ubicacionInput');
    var status = document.getElementById('geoStatus');
    if (!btn || !input) return;

    btn.addEventListener('click', function () {
      if (!('geolocation' in navigator)) {
        status.textContent = 'Tu navegador no permite compartir ubicación.';
        status.className = 'appt-geo-status is-error';
        return;
      }
      btn.classList.remove('is-done');
      btn.classList.add('is-loading');
      status.textContent = 'Solicitando permiso de ubicación...';
      status.className = 'appt-geo-status';

      navigator.geolocation.getCurrentPosition(function (pos) {
        var lat = pos.coords.latitude.toFixed(6);
        var lng = pos.coords.longitude.toFixed(6);
        var mapsLink = 'https://maps.google.com/?q=' + lat + ',' + lng;

        var current = input.value.trim();
        if (current && current.indexOf('maps.google.com') === -1) {
          input.value = current + ' — ' + mapsLink;
        } else {
          input.value = mapsLink;
        }

        btn.classList.remove('is-loading');
        btn.classList.add('is-done');
        status.textContent = 'Ubicación actual agregada ✓';
        status.className = 'appt-geo-status is-ok';
      }, function (err) {
        btn.classList.remove('is-loading');
        status.textContent = err.code === 1
          ? 'Debes permitir el acceso a tu ubicación para usar esto.'
          : 'No pudimos obtener tu ubicación. Escríbela manualmente.';
        status.className = 'appt-geo-status is-error';
      }, { enableHighAccuracy: true, timeout: 10000 });
    });
  })();

  // Envío del formulario -> arma el mensaje (con enlace a Google Calendar) y abre WhatsApp
  (function () {
    var WHATSAPP_NUMBER = '18494416329';
    var form = document.getElementById('appointmentForm');
    if (!form) return;

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    // Interpreta "25/12/2026", "25-12-2026" o "2026-12-25"
    function parseDateFlexible(str) {
      str = (str || '').trim();
      var m = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
      m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) return { y: +m[3], mo: +m[2], d: +m[1] };
      return null;
    }

    // Interpreta "3:00 pm", "3pm", "15:00", "03:00 PM"
    function parseTimeFlexible(str) {
      str = (str || '').trim().toLowerCase();
      var m = str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
      if (!m) return null;
      var h = parseInt(m[1], 10);
      var min = m[2] ? parseInt(m[2], 10) : 0;
      var ap = m[3];
      if (ap === 'pm' && h < 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      if (isNaN(h) || h > 23 || min > 59) return null;
      return { h: h, m: min };
    }

    function buildCalendarLink(d) {
      var dateObj = parseDateFlexible(d.get('dia'));
      var timeObj = parseTimeFlexible(d.get('hora'));
      var datesParam = '';
      if (dateObj && timeObj) {
        var start = new Date(dateObj.y, dateObj.mo - 1, dateObj.d, timeObj.h, timeObj.m);
        var end = new Date(start.getTime() + 60 * 60 * 1000);
        var fmt = function (dt) {
          return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + 'T' + pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
        };
        datesParam = '&dates=' + fmt(start) + '/' + fmt(end);
      }
      var title = 'Instalación GPS — ' + (d.get('nombre') || 'Cliente');
      var details =
        'Vehículo: ' + d.get('vehiculo') + '\n' +
        'Plan: ' + d.get('plan') + '\n' +
        'Encendido: ' + d.get('encendido') + '\n' +
        'WhatsApp del cliente: ' + d.get('whatsapp');
      var params =
        'action=TEMPLATE' +
        '&text=' + encodeURIComponent(title) +
        '&details=' + encodeURIComponent(details) +
        '&location=' + encodeURIComponent(d.get('ubicacion') || '') +
        datesParam;
      return 'https://calendar.google.com/calendar/render?' + params;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var d = new FormData(form);
      var calendarLink = buildCalendarLink(d);
      var msg =
        '📋 Formulario para citas\n' +
        '🧑 Nombre: ' + d.get('nombre') + '\n' +
        '📞 WhatsApp: ' + d.get('whatsapp') + '\n' +
        '📧 Correo: ' + (d.get('correo') || '-') + '\n' +
        '📅 Día: ' + d.get('dia') + '\n' +
        '🕒 Hora: ' + d.get('hora') + '\n' +
        '🚘 Vehículo: ' + d.get('vehiculo') + '\n' +
        '🔑 Encendido (Botón o Llave): ' + d.get('encendido') + '\n' +
        '📦 Plan: ' + d.get('plan') + '\n' +
        '🆘 Contacto de emergencia: ' + (d.get('emergencia') || '-') + '\n' +
        '💳 Método de pago: ' + d.get('pago') + '\n' +
        '📍 Ubicación: ' + d.get('ubicacion') + '\n\n' +
        '📆 Agregar al calendario: ' + calendarLink;
      var url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);
      window.open(url, '_blank');
    });
  })();
</script>
